version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=4000
      - NODE_OPTIONS=--max-old-space-size=256
      - DATA_PATH=/app/data
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-fotos-cancha}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      - MP_ACCESS_TOKEN=${MP_ACCESS_TOKEN:-}
      - FRONTEND_URL=${FRONTEND_URL:-https://alentar.com.ar}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:-https://alentar.com.ar}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-alentar2026}
      - DEFAULT_PRICE_ARS=${DEFAULT_PRICE_ARS:-4000}
      - DEFAULT_PROMO_QTY=${DEFAULT_PROMO_QTY:-3}
      - DEFAULT_PROMO_PRICE_ARS=${DEFAULT_PROMO_PRICE_ARS:-10000}
    volumes:
      - ./data:/app/data
    expose:
      - "4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_INTERNAL_URL=http://backend:4000
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=256
      - PORT=3000
      - BACKEND_INTERNAL_URL=http://backend:4000
    depends_on:
      - backend
    ports:
      - "3000:3000"
